  <script>
    // BACKEND CONFIGURATION: Paste your API Key here directly
    const BACKEND_ELEVENLABS_KEY = "42a6c4b58b2c4f0491cff693643e98a399507c5159fb6c2b5f70f277658c3082";

    // Voice IDs tuned for romantic/soft narration
    const ELEVEN_LABS_VOICE_IDS = [
      "21m00Tcm4TlvDq8ikWAM", // Rachel
      "EXAVITQu4vr4xnSDxMaL", // Bella
      "AZnzlk1XvdvUeBnXmlld"  // Domi
    ];

    const FEMALE_MODEL_PHOTO_IDS = [
      "1534528741775-53994a69daeb",
      "1517841905240-472988babdf9",
      "1524504388940-b1c1722653e1",
      "1494790108377-be9c29b29330",
      "1529626455594-4ff0802cfb7e",
      "1488426862026-3ee34a7d66df",
      "1544005313-94ddf0286df2",
      "1503104897754-594366cbf614",
      "1531746020798-e6953c6e8e04",
      "1519085360753-af0119f7cbe7"
    ];

    // Complete, detailed Hindi story scripts
    const EXTENDED_STORIES_SCRIPTS = [
      "Suno na... Aaj ki raat badi ajeeb aur udas lag rahi hai. Bahar aangan mein thandi purvaiya hawa chal rahi hai, aur main akele baith kar tumhara intezar kar rahi hoon. Khidki se aati mitti ki sondhi khushbu aur ye garam chai, mera dil karta hai ki ye pal hamesha ke liye yahi thehar jaye. Tumhari aawaz jab bhi mere kaanon mein padti hai, mere dil ko kitna sukoon milta hai.",
      "Arey suno... Ye dastaan hai hamari us haseen shaam ki jab poora gaon so chuka tha. Peepal ke vriksh ke neeche baith kar, chaand ki madham roshni mein main bas tumhare chehre ko dekhti rahi. Humne kitni saari baatein ki, par lagta hai jaise abhi toh mulaqat shuru hui hai. Tumhara ek ek lafz mere dil mein bas gaya hai.",
      "Raat ka aakhri pehar hai aur chaaro taraf gehri khamoshi hai. Hamari ye pyari si kahani ab ek naya mod le rahi hai. Akelapan mein bhi dil mein ek alag hi tarang chal rahi hai. Tumhari aankhon mein jo raaz chupa tha, aaj wo sab mujhe mehsoos ho raha hai.",
      "Aangan ki mitti ki khushbu aur wo haseen mulaqat mujhe aaj bhi yaad aati hai. Kacha makan, dhibri ki madham roshni, aur purani yaadon ko dohrana. Ye safar kitna pyara hai na."
    ];

    const STORIES_DATA = Array.from({ length: 100 }, (_, i) => {
      const categories = ['whisper', 'romance', 'mystery'];
      const voices = ['Riya', 'Suman', 'Ananya', 'Meera', 'Kavya'];
      const photoId = FEMALE_MODEL_PHOTO_IDS[i % FEMALE_MODEL_PHOTO_IDS.length];
      
      return {
        id: i + 1,
        title: `Kahani #${i + 1} — ${['Reshmi Baatein', 'Aangan Ki Saanjh', 'Ehsaas Pyar Ka', 'Raat Ki Khamoshi', 'Dil Ki Pukaar'][i % 5]}`,
        category: categories[i % categories.length],
        voiceName: voices[i % voices.length],
        voiceId: ELEVEN_LABS_VOICE_IDS[i % ELEVEN_LABS_VOICE_IDS.length],
        image: `https://images.unsplash.com/photo-${photoId}?auto=format&fit=crop&w=400&h=500&q=80&sig=${i + 1}`,
        script: EXTENDED_STORIES_SCRIPTS[i % EXTENDED_STORIES_SCRIPTS.length],
        duration: `${Math.floor(Math.random() * 15) + 10}:00`
      };
    });

    const KahaniApp = {
      init() {
        this.renderGrid(STORIES_DATA);
      },

      filter(category, el) {
        document.querySelectorAll('.cat-tab').forEach(tab => {
          tab.className = 'cat-tab bg-[#181822] text-zinc-300 hover:bg-[#20202C] border border-white/10 px-4 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition-all';
          tab.setAttribute('aria-selected', 'false');
        });

        el.className = 'cat-tab bg-amber-500 text-black px-4 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition-all shadow-md shadow-amber-500/10';
        el.setAttribute('aria-selected', 'true');

        const filtered = category === 'all' 
          ? STORIES_DATA 
          : STORIES_DATA.filter(s => s.category === category);

        this.renderGrid(filtered);
      },

      renderGrid(stories) {
        const grid = document.getElementById('story-grid');
        if (!grid) return;
        grid.innerHTML = stories.map(s => `
          <article onclick="KahaniPlayer.playStory(${s.id})" class="group bg-[#181822] hover:bg-[#20202C] border border-white/10 hover:border-amber-500/40 rounded-2xl p-3.5 transition-all duration-300 cursor-pointer flex flex-col justify-between shadow-lg hover:shadow-2xl hover:shadow-amber-500/5">
            <div>
              <div class="aspect-[3/4] rounded-xl overflow-hidden mb-3 relative bg-zinc-800 border border-white/5">
                <img src="${s.image}" alt="${s.title}" loading="lazy" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500"/>
                <button aria-label="Play ${s.title}" class="absolute bottom-3 right-3 w-10 h-10 rounded-full bg-amber-500 text-black font-bold flex items-center justify-center opacity-0 group-hover:opacity-100 transform translate-y-2 group-hover:translate-y-0 transition-all shadow-xl">
                  ▶
                </button>
              </div>
              <h3 class="font-bold text-sm text-zinc-100 truncate serif-title group-hover:text-amber-400">${s.title}</h3>
              <p class="text-[11px] text-amber-300/80 font-medium mt-0.5">👩 Aawaz: ${s.voiceName}</p>
            </div>
            <div class="mt-3 pt-2 border-t border-white/10 flex justify-between items-center text-[10px] text-zinc-400">
              <span>⏱ ${s.duration} mins</span>
              <span class="text-amber-400 font-medium">🪈 Pura Suno</span>
            </div>
          </article>
        `).join('');
      }
    };

    const KahaniPlayer = {
      mainAudio: new Audio(),
      bgmAudio: new Audio("https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c8230553.mp3?filename=indian-meditation-flute-10174.mp3"),
      isPlaying: false,
      currentStory: null,

      async fetchVoiceStream(text, voiceId) {
        const response = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${voiceId}`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'xi-api-key': BACKEND_ELEVENLABS_KEY,
            'Accept': 'audio/mpeg'
          },
          body: JSON.stringify({
            text: text,
            model_id: "eleven_multilingual_v2",
            voice_settings: {
              stability: 0.75,         // High stability prevents words cutting off at the end
              similarity_boost: 0.85,  // Ensures exact pronunciation
              style: 0.0,              // 0 style ensures full stability across full sentences
              use_speaker_boost: true
            }
          })
        });

        if (!response.ok) {
          throw new Error('TTS Stream Error');
        }

        const blob = await response.blob();
        return URL.createObjectURL(blob);
      },

      async playStory(id) {
        const story = STORIES_DATA.find(s => s.id === id);
        if (!story) return;

        this.currentStory = story;
        document.getElementById('player-title').innerText = story.title;
        document.getElementById('player-artist').innerText = `${story.voiceName} • Pyari Aawaz`;
        document.getElementById('player-status').innerText = '⏳ Full Audio Ready Kar Rahe Hain...';
        document.getElementById('play-btn').innerText = '⏳';

        try {
          const audioBlobUrl = await this.fetchVoiceStream(story.script, story.voiceId);
          
          this.mainAudio.src = audioBlobUrl;
          this.mainAudio.volume = 1.0; 
          this.mainAudio.playbackRate = 0.90; // Natural, clear pace without word skipping

          this.bgmAudio.volume = 0.0001;
          this.bgmAudio.loop = true;

          await Promise.all([this.mainAudio.play(), this.bgmAudio.play()]);
          this.updatePlaybackState(true, '🟢 Sunaat Bani...');
        } catch (err) {
          console.error("Playback error", err);
          document.getElementById('player-status').innerText = 'API Check Karein';
          this.updatePlaybackState(false, 'Retry');
        }

        this.mainAudio.onended = () => {
          this.bgmAudio.pause();
          this.bgmAudio.currentTime = 0;
          this.updatePlaybackState(false, 'Kahani Poori Bhail');
        };
      },

      togglePlay() {
        if (!this.currentStory) {
          this.playStory(1);
          return;
        }

        if (this.isPlaying) {
          this.mainAudio.pause();
          this.bgmAudio.pause();
          this.updatePlaybackState(false, 'Ruk Gail');
        } else {
          this.mainAudio.play();
          this.bgmAudio.play();
          this.updatePlaybackState(true, 'Chal Rahi Ba');
        }
      },

      updatePlaybackState(playing, statusText) {
        this.isPlaying = playing;
        document.getElementById('play-btn').innerText = playing ? '⏸' : '▶';
        document.getElementById('player-status').innerText = statusText;
        
        const eq = document.getElementById('eq-indicator');
        if (eq) {
          if (playing) eq.classList.remove('hidden'), eq.classList.add('flex');
          else eq.classList.add('hidden'), eq.classList.remove('flex');
        }
      },

      playRandomStory() {
        const randomId = Math.floor(Math.random() * STORIES_DATA.length) + 1;
        this.playStory(randomId);
      }
    };

    window.addEventListener('DOMContentLoaded', () => KahaniApp.init());
  </script>
