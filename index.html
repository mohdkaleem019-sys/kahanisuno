<script>
    const ELEVENLABS_API_KEY = "sk_be4b0088e042c0ee796432d5cd919f1ea0ef68e2b4fefe38"; 

    // Using standard, globally available ElevenLabs Voice IDs
    // "21m00Tcm4TlvDq8ikWAM" (Rachel), "EXAVITQu4vr4xnSDxMaL" (Bella), "MF3mGyEYCl7XYWbV9V6O" (Elli)
    let currentVoiceId = "21m00Tcm4TlvDq8ikWAM";
    let currentText = "Tumhare pass aakar... jab main dheere se tumhare kaan me bolungi, kya tum sunoge?";
    let isPlaying = false;

    const audioEl = document.getElementById('audio-element');
    const playBtn = document.getElementById('play-btn');
    const statusEl = document.getElementById('player-status');

    // AI Story Generator Engine (Simulates Dynamic Backend Story Generation)
    function generateAIStory(title, category) {
      const prompts = {
        'Chupke Se...': "Suniye... Raat bohot gehri ho chuki hai. Tumhare pass aakar jab main dheere se tumhare kaan me bolungi... kya tum meri dhadkan sun paoge?",
        'Raat Aur Tum': "Aaj ki raat bohot khamosh hai. Sirf tum, main, aur hamari ye adhuri baatein. Kya tum mere kareeb aaoge?",
        'Ehsaas Tera': "Door rehna ab mushkil hai. Tumhari saansein jab meri gardan ko chhuti hain... to dil ki dhadkan tez ho jaati hai."
      };
      return prompts[title] || "Suniye... Ek nayi kahani ki shuruat karte hain sirf aapke liye.";
    }

    // Direct ElevenLabs API Call with Error Diagnostics
    async function fetchElevenLabsAudio(text, voiceId) {
      statusEl.innerText = "⚡ AI Writing & Voice Syncing...";
      playBtn.innerText = '⏳';

      try {
        const response = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${voiceId}`, {
          method: 'POST',
          headers: {
            'Accept': 'audio/mpeg',
            'xi-api-key': ELEVENLABS_API_KEY,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            text: text,
            model_id: "eleven_multilingual_v2",
            voice_settings: {
              stability: 0.5,
              similarity_boost: 0.75,
              style: 0.3
            }
          })
        });

        if (!response.ok) {
          const errData = await response.json().catch(() => ({}));
          throw new Error(errData.detail?.message || `API Error: ${response.status}`);
        }

        const audioBlob = await response.blob();
        const audioUrl = URL.createObjectURL(audioBlob);

        audioEl.src = audioUrl;
        await audioEl.play();
        isPlaying = true;
        playBtn.innerText = '⏸';
        statusEl.innerText = '🟢 Playing ElevenLabs AI Audio';

      } catch (err) {
        console.error("ElevenLabs Direct Audio Failure:", err);
        statusEl.innerText = "⚠️ Voice API Error - Check Console";
        playBtn.innerText = '▶';
        isPlaying = false;
        
        // Browser Speech Synthesis Fallback if ElevenLabs API key/quota fails
        playBrowserTTS(text);
      }
    }

    // Web Speech API Fallback (Ensures audio ALWAYS plays even if API errors out)
    function playBrowserTTS(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'hi-IN';
        utterance.pitch = 1.1;
        utterance.rate = 0.85;

        utterance.onstart = () => {
          isPlaying = true;
          playBtn.innerText = '⏸';
          statusEl.innerText = '🔊 Playing Audio (Browser AI)';
        };

        utterance.onend = () => {
          isPlaying = false;
          playBtn.innerText = '▶';
          statusEl.innerText = 'Ready';
        };

        window.speechSynthesis.speak(utterance);
      }
    }

    function togglePlay() {
      if (isPlaying) {
        audioEl.pause();
        if ('speechSynthesis' in window) window.speechSynthesis.pause();
        playBtn.innerText = '▶';
        statusEl.innerText = 'Paused';
        isPlaying = false;
      } else {
        fetchElevenLabsAudio(currentText, currentVoiceId);
      }
    }

    // Triggered when clicking any Story Card
    function loadStory(title, artist, duration, text, voiceId) {
      document.getElementById('player-title').innerText = title;
      document.getElementById('player-artist').innerText = artist;
      document.getElementById('player-duration').innerText = duration;

      // 1. Generate story text dynamically
      currentText = generateAIStory(title);
      currentVoiceId = voiceId || "21m00Tcm4TlvDq8ikWAM";

      // 2. Sync text with ElevenLabs and autoplay audio
      fetchElevenLabsAudio(currentText, currentVoiceId);
    }

    function playDemo() {
      loadStory('Chupke Se...', 'Aisha (ElevenLabs AI)', '14:20', '', '21m00Tcm4TlvDq8ikWAM');
    }

    // Helper functions
    function openAuthModal(mode) { document.getElementById('auth-modal').classList.remove('hidden'); switchAuthTab(mode); }
    function closeAuthModal() { document.getElementById('auth-modal').classList.add('hidden'); }
    function switchAuthTab(mode) {
      const tabLogin = document.getElementById('tab-login');
      const tabSignup = document.getElementById('tab-signup');
      const submitBtn = document.getElementById('auth-submit-btn');
      if (mode === 'login') {
        tabLogin.className = "flex-1 pb-3 text-sm font-semibold text-amber-400 border-b-2 border-amber-400";
        tabSignup.className = "flex-1 pb-3 text-sm font-semibold text-gray-400 border-b-2 border-transparent";
        submitBtn.innerText = "Sign In";
      } else {
        tabSignup.className = "flex-1 pb-3 text-sm font-semibold text-amber-400 border-b-2 border-amber-400";
        tabLogin.className = "flex-1 pb-3 text-sm font-semibold text-gray-400 border-b-2 border-transparent";
        submitBtn.innerText = "Create Account";
      }
    }
    function handleAuth(e) { e.preventDefault(); alert("Authentication successful!"); closeAuthModal(); }
    function filterCategory(btn, category) {
      document.querySelectorAll('.category-btn').forEach(b => { b.className = "category-btn bg-white/5 hover:bg-white/10 text-gray-300 border border-white/10 px-4 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition"; });
      btn.className = "category-btn bg-amber-500 text-black px-4 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition";
      document.querySelectorAll('.story-card').forEach(card => {
        if (category === 'all' || card.dataset.category === category) card.classList.remove('hidden');
        else card.classList.add('hidden');
      });
    }

    audioEl.onended = () => {
      isPlaying = false;
      playBtn.innerText = '▶';
      statusEl.innerText = 'Playback Finished';
    };
  </script>
