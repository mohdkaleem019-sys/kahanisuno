<!-- Hidden High-Quality HTML5 Audio Tag -->
<audio id="audio-element" preload="auto" crossorigin="anonymous"></audio>

<script>
  let isPlaying = false;
  const audioEl = document.getElementById('audio-element');
  const playBtn = document.getElementById('play-btn');

  // --- ELEVENLABS & ANTARVASNA CONFIGURATION ---
  const ELEVENLABS_API_KEY = "YOUR_ELEVENLABS_API_KEY"; // Replace with your actual ElevenLabs API key
  const ELEVENLABS_VOICE_ID = "21m00Tcm4TlvDq8ikWAM"; // Hindi / Multilingual voice ID
  const ANTARVASNA_URL = "https://antarvasnastory.weebly.com";

  // --- WEB AUDIO API HIGH-QUALITY ENGINE ---
  let audioCtx, source, compressor;

  function initHighQualityAudio() {
    if (!audioCtx) {
      // 1. Create Web Audio Context
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioContext();

      // 2. Connect the HTML5 audio element as the source node
      source = audioCtx.createMediaElementSource(audioEl);

      // 3. Add a Dynamics Compressor for balanced loudness & high vocal clarity
      compressor = audioCtx.createDynamicsCompressor();
      compressor.threshold.setValueAtTime(-24, audioCtx.currentTime);
      compressor.knee.setValueAtTime(30, audioCtx.currentTime);
      compressor.ratio.setValueAtTime(12, audioCtx.currentTime);
      compressor.attack.setValueAtTime(0.003, audioCtx.currentTime);
      compressor.release.setValueAtTime(0.25, audioCtx.currentTime);

      // 4. Chain: Audio Source -> Dynamics Compressor -> System Speakers
      source.connect(compressor);
      compressor.connect(audioCtx.destination);
    }

    // Resume context if suspended (browser audio safety rule)
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  // --- PLAYER ACTIONS ---
  function togglePlay() {
    initHighQualityAudio(); // Initialize HQ engine on user click

    if (isPlaying) {
      audioEl.pause();
      playBtn.innerText = '▶';
    } else {
      audioEl.play().then(() => {
        playBtn.innerText = '⏸';
      }).catch(err => console.error("Playback error:", err));
    }
    isPlaying = !isPlaying;
  }

  function loadStory(title, artist, duration, audioUrl) {
    initHighQualityAudio();

    // Set UI metadata
    document.getElementById('player-title').innerText = title;
    document.getElementById('player-artist').innerText = artist;
    document.getElementById('player-duration').innerText = duration;

    // Load and play high-bitrate audio stream
    if (audioUrl) {
      audioEl.src = audioUrl;
      audioEl.load();
      audioEl.play();
      isPlaying = true;
      playBtn.innerText = '⏸';
    }
  }

  function playDemo() {
    // Provide your HQ MP3 or AAC file URL here
    loadStory('Khamosh Raatein', 'Rahul Sharma', '12:45', 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3');
  }

  // --- EXTRA ACTIVITIES & ELEVENLABS TTS ---

  // 1. Direct Website Redirect
  function openAntarvasnaSite() {
    window.open(ANTARVASNA_URL, '_blank');
  }

  // 2. Convert Story Text to Speech using ElevenLabs API
  async function convertTextWithElevenLabs(text, title = "Antarvasna Audio") {
    if (ELEVENLABS_API_KEY === "YOUR_ELEVENLABS_API_KEY") {
      alert("Please configure your ElevenLabs API key in the script.");
      return;
    }

    try {
      const response = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${ELEVENLABS_VOICE_ID}`, {
        method: 'POST',
        headers: {
          'Accept': 'audio/mpeg',
          'xi-api-key': ELEVENLABS_API_KEY,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          text: text,
          model_id: "eleven_multilingual_v2",
          voice_settings: { stability: 0.5, similarity_boost: 0.75 }
        })
      });

      if (!response.ok) throw new Error("ElevenLabs audio generation failed.");

      const audioBlob = await response.blob();
      const audioUrl = URL.createObjectURL(audioBlob);

      // Pass generated stream into your standard player function
      loadStory(title, 'ElevenLabs Voice', 'Auto', audioUrl);

    } catch (error) {
      console.error(error);
      alert("Error generating speech with ElevenLabs.");
    }
  }

  // 3. Trigger ElevenLabs audio by prompting for text input
  function generateStoryAudio() {
    const storyText = prompt("Paste the story text from Antarvasna to generate audio:");
    if (storyText) {
      convertTextWithElevenLabs(storyText, "Antarvasna Audio Story");
    }
  }
</script>
