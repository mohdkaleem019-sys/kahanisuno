<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KahaniSuno - Intimate Audio Stories</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    h1, h2, .serif { font-family: 'Playfair Display', serif; }
  </style>
</head>
<body class="bg-[#0B0B0C] text-gray-100 antialiased min-h-screen">

  <!-- NAVBAR -->
  <nav class="flex items-center justify-between px-6 py-4 max-w-7xl mx-auto border-b border-white/5">
    <div class="flex items-center space-x-2">
      <span class="text-amber-500 text-xl font-bold">|||</span>
      <span class="text-xl font-bold tracking-wide serif">KahaniSuno</span>
    </div>
    <div class="hidden md:flex items-center space-x-8 text-sm text-gray-400">
      <a href="#stories" class="hover:text-amber-500 transition">Stories</a>
      <a href="#pricing" class="hover:text-amber-500 transition">Pricing</a>
      <a href="#creators" class="hover:text-amber-500 transition">Creators</a>
    </div>
    <div class="flex items-center space-x-4">
      <button class="text-sm text-gray-300 hover:text-white">Sign In</button>
      <button class="bg-amber-200 text-black px-4 py-2 rounded-full text-sm font-semibold hover:bg-amber-300 transition">Start Free</button>
    </div>
  </nav>

  <!-- HERO SECTION WITH THE NEW BUTTON ADDED -->
  <header class="px-6 pt-16 pb-12 text-center max-w-4xl mx-auto space-y-6">
    <span class="inline-block text-xs tracking-widest uppercase text-amber-500 font-semibold px-3 py-1 bg-amber-500/10 rounded-full border border-amber-500/20">
      18+ ADULTS ONLY
    </span>
    <h1 class="text-4xl md:text-6xl font-bold tracking-tight leading-tight">
      Suniye Woh Kahaniyaan Jo <br class="hidden md:inline"/> Sirf Aapke Liye Hain
    </h1>
    <p class="text-amber-200/80 italic text-lg serif">Stories Made Only For You</p>
    <p class="text-gray-400 text-sm md:text-base max-w-xl mx-auto">
      India's most intimate audio storytelling platform. Thousands of premium stories, whispered just for you.
    </p>

    <!-- ACTION BUTTONS BLOCK (NOW WITH 3 BUTTONS) -->
    <div class="flex flex-wrap items-center justify-center gap-4 pt-2">
      <!-- Button 1 -->
      <button class="bg-amber-200 text-black px-6 py-3 rounded-full font-semibold hover:bg-amber-300 transition flex items-center gap-2">
        <span>🎧</span> Start Listening Free
      </button>

      <!-- NEW BUTTON ADDED -->
      <button class="bg-amber-500/10 border border-amber-500/40 text-amber-400 px-6 py-3 rounded-full font-semibold hover:bg-amber-500/20 transition flex items-center gap-2">
        <span>⚡</span> Explore Premium
      </button>

      <!-- Button 3 -->
      <button class="border border-white/20 px-6 py-3 rounded-full font-semibold hover:bg-white/5 transition">
        Browse Stories
      </button>
    </div>
  </header>

</body>
</html>
