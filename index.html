<!-- Hidden High-Quality HTML5 Audio Tag -->
<audio id="audio-element" preload="auto" crossorigin="anonymous"></audio>

<script>
  let isPlaying = false;
  const audioEl = document.getElementById('audio-element');
  const playBtn = document.getElementById('play-btn');

  // --- WEB AUDIO API HIGH-QUALITY ENGINE ---
  let audioCtx, source, compressor;

  function initHighQualityAudio() {
    if (!audioCtx) {
      // 1. Create Web Audio Context
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioContext();

      // 2. Connect the HTML5 audio element as the source node
      source = audioCtx.createMediaElementSource(audioEl);

      // 3. Add a Dynamics Compressor for balanced loudness & high vocal clarity
      compressor = audioCtx.createDynamicsCompressor();
      compressor.threshold.setValueAtTime(-24, audioCtx.currentTime);
      compressor.knee.setValueAtTime(30, audioCtx.currentTime);
      compressor.ratio.setValueAtTime(12, audioCtx.currentTime);
      compressor.attack.setValueAtTime(0.003, audioCtx.currentTime);
      compressor.release.setValueAtTime(0.25, audioCtx.currentTime);

      // 4. Chain: Audio Source -> Dynamics Compressor -> System Speakers
      source.connect(compressor);
      compressor.connect(audioCtx.destination);
    }

    // Resume context if suspended (browser audio safety rule)
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  // --- PLAYER ACTIONS ---
  function togglePlay() {
    initHighQualityAudio(); // Initialize HQ engine on user click

    if (isPlaying) {
      audioEl.pause();
      playBtn.innerText = '▶';
    } else {
      audioEl.play().then(() => {
        playBtn.innerText = '⏸';
      }).catch(err => console.error("Playback error:", err));
    }
    isPlaying = !isPlaying;
  }

  function loadStory(title, artist, duration, audioUrl) {
    initHighQualityAudio();

    // Set UI metadata
    document.getElementById('player-title').innerText = title;
    document.getElementById('player-artist').innerText = artist;
    document.getElementById('player-duration').innerText = duration;

    // Load and play high-bitrate audio stream
    if (audioUrl) {
      audioEl.src = audioUrl;
      audioEl.load();
      audioEl.play();
      isPlaying = true;
      playBtn.innerText = '⏸';
    }
  }

  function playDemo() {
    // Provide your HQ MP3 or AAC file URL here
    loadStory('Khamosh Raatein', 'Rahul Sharma', '12:45', 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3');
  }
</script>
